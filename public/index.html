<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student MongoDB CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Student Management System</h1>
    <p class="subtitle">HTML + CSS + JavaScript + Node.js + Express + MongoDB</p>

    <form id="studentForm">
        <input type="hidden" id="studentId">
        <input type="text" id="name" placeholder="Student Name" required>
        <input type="email" id="email" placeholder="Email" required>

        <select id="course" required>
            <option value="">Select Course</option>
            <option value="MERN">MERN</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="DSA">DSA</option>
        </select>

        <button type="submit" id="submitButton">Add Student</button>
        <button type="button" id="cancelButton" class="cancel" hidden>Cancel Edit</button>
    </form>

    <p id="message"></p>
    <h2>Registered Students</h2>
    <div id="studentList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
